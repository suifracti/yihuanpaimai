name: Offline PR contracts

on:
  pull_request:
    branches:
      - main
      - codex/issue-11-current-source

permissions:
  contents: read

concurrency:
  group: offline-contracts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python-half-viewport:
    name: Python offline half-viewport contract
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        id: setup-python
        continue-on-error: true
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install locked offline contract dependencies
        id: install-python-deps
        if: steps.setup-python.outcome == 'success'
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check --no-input numpy==2.2.6 onnxruntime==1.23.2 opencv-python==5.0.0.93 rapidocr-onnxruntime==1.4.4 websockets==16.1.1 mss==10.2.0 pywin32==312

      - name: Run M1 partial DRAFT and one-shot exit contracts
        id: m1-contracts
        if: steps.install-python-deps.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'build'
          $tempDir = Join-Path $buildDir 'ci-test-temp'
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          $env:TMP = $tempDir
          $env:TEMP = $tempDir
          python tools/run_tests.py test_native_warehouse_intake.NativeWarehouseIntakeTests.test_saved_processing_survives_stop_and_new_match_without_misattribution test_native_one_shot_runner --output build/ci-m1-contracts.json
          $testExitCode = $LASTEXITCODE
          $status = 'NOT_RUN'
          if (Test-Path build/ci-m1-contracts.json) {
            $result = Get-Content build/ci-m1-contracts.json -Raw | ConvertFrom-Json
            if ($testExitCode -ne 0 -or $result.failures.Count -gt 0 -or $result.errors.Count -gt 0) {
              $status = 'FAIL'
            } elseif ($result.skipped.Count -gt 0) {
              $status = 'SKIP'
            } elseif ($result.tests -eq 23) {
              $status = 'PASS'
            }
            "M1 contracts: $status; tests=$($result.tests); skipped=$($result.skipped.Count)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($status -ne 'PASS') { exit 1 }

      - name: Run observe-stage and loading regressions
        id: observe-diagnostics
        if: steps.install-python-deps.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $outputPath = 'build/ci-issue38-observe.json'
          python tools/run_tests.py test_vision_observe_timing test_vision_scene_loading --output $outputPath
          $testExitCode = $LASTEXITCODE
          if (-not (Test-Path $outputPath)) {
            $status = 'NOT_RUN'
            'Observe-stage/scene-loading regressions: NOT_RUN (no result file)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            $result = Get-Content $outputPath -Raw | ConvertFrom-Json
            if ($testExitCode -ne 0 -or $result.failures.Count -gt 0 -or $result.errors.Count -gt 0 -or $result.tests -ne 13 -or $result.skipped.Count -gt 0) {
              $status = 'FAIL'
            } else {
              $status = 'PASS'
            }
            "Observe-stage/scene-loading regressions: $status; tests=$($result.tests); skipped=$($result.skipped.Count)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($status -ne 'PASS') { exit 1 }

      - name: Run full Native DELIVERY eligibility contract
        id: native-delivery-contract
        if: steps.install-python-deps.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'build'
          $tempDir = Join-Path $buildDir 'ci-delivery-temp'
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $buildDir 'native-delivery-20261006') -Force | Out-Null
          $env:TMP = $tempDir
          $env:TEMP = $tempDir
          $outputPath = 'build/ci-native-delivery-contract.json'
          python tools/run_tests.py test_native_delivery_contract --output $outputPath
          $testExitCode = $LASTEXITCODE
          $status = 'NOT_RUN'
          $tests = 0
          $failureCount = 0
          $errorCount = 0
          $skipCount = 0
          if (Test-Path $outputPath) {
            $result = Get-Content $outputPath -Raw | ConvertFrom-Json
            $tests = [int]$result.tests
            $failureCount = @($result.failures).Count
            $errorCount = @($result.errors).Count
            $skipCount = @($result.skipped).Count
            if ($testExitCode -ne 0 -or $tests -ne 15 -or $failureCount -ne 0 -or $errorCount -ne 0 -or $skipCount -ne 0) {
              $status = 'FAIL'
            } else {
              $status = 'PASS'
            }
          }
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tests=$tests" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "failures=$failureCount" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "errors=$errorCount" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "skipped=$skipCount" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Full Native DELIVERY contract: $status; tests=$tests; failures=$failureCount; errors=$errorCount; skipped=$skipCount" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($status -ne 'PASS') { exit 1 }

      - name: Run offline Python contract
        id: python-contract
        if: steps.install-python-deps.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          python -m unittest tests.test_native_half_viewport_flow -v
          $testExitCode = $LASTEXITCODE
          "test_exit_code=$testExitCode" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($testExitCode -ne 0) { exit $testExitCode }

      - name: Run integrated overlap and composite feasibility contracts
        id: integrated-python-contracts
        if: steps.install-python-deps.outcome == 'success'
        shell: pwsh
        run: |
          python tools/run_tests.py test_native_sparse_overlap test_solver_composite_feasibility_v1 --output build/ci-issue24-integrated-python.json
          $testExitCode = $LASTEXITCODE
          if (-not (Test-Path build/ci-issue24-integrated-python.json)) {
            'Integrated Python contracts: NOT_RUN (no result file)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 1
          }
          $result = Get-Content build/ci-issue24-integrated-python.json -Raw | ConvertFrom-Json
          $expectedPrivateSkip = 'test_native_sparse_overlap.SparseOverlapTests.test_identity_checked_real_sequence_has_pixel_continuity'
          $unexpectedSkips = @($result.skipped | Where-Object { $_[0] -ne $expectedPrivateSkip })
          if ($testExitCode -ne 0 -or $result.failures.Count -gt 0 -or $result.errors.Count -gt 0 -or $result.tests -ne 7 -or $unexpectedSkips.Count -gt 0 -or $result.skipped.Count -gt 1) {
            $status = 'FAIL'
          } elseif ($result.skipped.Count -eq 1) {
            $status = 'PASS (private Issue #31 replay SKIP)'
          } else {
            $status = 'PASS'
          }
          "Integrated overlap/composite contracts: $status; tests=$($result.tests); skipped=$($result.skipped.Count)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($status -eq 'FAIL') { exit 1 }

      - name: Set up Node.js for v06 engine self-tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run v06 engine reliability self-tests
        id: v06-engine-self-tests
        shell: pwsh
        run: |
          node -e "const e=require('./core/auction_engine_v06.js');const r=e.runV06ReliabilitySelfTests();console.log(JSON.stringify(r));if(!r.passed||r.tested!==8)process.exit(1)"
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -eq 0) {
            'v06 engine reliability self-tests: 8/8 PASS' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            'v06 engine reliability self-tests: FAIL' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit $testExitCode
          }

      - name: Run read-only bid intent status UI contract
        id: bid-intent-ui
        continue-on-error: true
        shell: pwsh
        run: |
          node tests/bid_intent_status_ui.js
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -eq 0) { $status = 'PASS' } else { $status = 'FAIL' }
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Read-only bid intent status UI: $status" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($testExitCode -ne 0) { exit $testExitCode }

      - name: Verify strict solver source gate on Windows checkout
        id: solver-source-compatibility
        if: steps.install-python-deps.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          git config --local core.autocrlf true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout-index --force -- lab/index.html assets/business_sot_v06.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $autocrlf = git config --local --get core.autocrlf
          $eol = git ls-files --eol -- lab/index.html assets/business_sot_v06.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $eolLines = @($eol)
          $eolLines | Write-Output
          if ($autocrlf -ne 'true' -or $eolLines.Count -ne 2 -or @($eolLines | Where-Object { $_ -notmatch 'w/lf' }).Count -ne 0) {
            'Windows checkout did not preserve both protected sources as LF with core.autocrlf=true.' | Write-Error
            exit 1
          }
          "Windows checkout core.autocrlf=$autocrlf; both protected sources are LF" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          python -c "import sys; sys.path.insert(0, 'core'); import venue_box_catalog as v; catalog=v.load_catalog(); checked=v.validate_solver_compatibility(catalog, v.load_solver_compatibility()); assert checked.ok, checked.errors; mapped=v.solver_context_translation(catalog, venue_id='venue-shanhu', box_id='box-shanhu-glass'); assert mapped.get('status') == 'COMPATIBILITY_TRANSLATION', mapped; print('strict source hashes: PASS; real venue-box mapping: COMPATIBILITY_TRANSLATION')"
          $checkExitCode = $LASTEXITCODE
          if ($checkExitCode -eq 0) { $status = 'PASS' } else { $status = 'FAIL' }
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Strict solver source gate: $status" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($checkExitCode -ne 0) { exit $checkExitCode }

      - name: Run Native Main Solver HUD consumer contract
        id: native-consumer-contract
        if: steps.install-python-deps.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $output = python -m unittest tests.test_native_main_solver_hud_consumption_v1 -v 2>&1
          $testExitCode = $LASTEXITCODE
          $output | Write-Output
          $combinedOutput = $output -join "`n"
          $runMatch = [regex]::Match($combinedOutput, 'Ran\s+(\d+)\s+tests?')
          $skipMatch = [regex]::Match($combinedOutput, 'OK\s+\(skipped=(\d+)\)')
          if ($testExitCode -ne 0) {
            $status = 'FAIL'
          } elseif (-not $runMatch.Success) {
            $status = 'NOT_RUN'
          } elseif ([int]$runMatch.Groups[1].Value -ne 8) {
            $status = 'SKIP'
          } elseif ($skipMatch.Success -and [int]$skipMatch.Groups[1].Value -gt 0) {
            $status = 'SKIP'
          } else {
            $status = 'PASS'
          }
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Native Main/Solver/HUD consumer contract: $status" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($status -ne 'PASS') { exit 1 }

      - name: Run Main bridge and raw PARTIAL page contracts
        id: native-raw-archive-main
        if: steps.install-python-deps.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $outputPath = 'build/ci-issue46-main-bridge.json'
          python tools/run_tests.py test_main_view_state_provider.MainViewStateProviderTests.test_bridge_reuses_existing_action_and_serializes_only_snapshot_payload test_main_view_state_provider.MainViewStateProviderTests.test_bridge_reads_a_single_raw_partial_archive_page --output $outputPath
          $testExitCode = $LASTEXITCODE
          if (-not (Test-Path $outputPath)) {
            $status = 'NOT_RUN'
          } else {
            $result = Get-Content $outputPath -Raw | ConvertFrom-Json
            $failures = @($result.failures).Count
            $errors = @($result.errors).Count
            $skipped = @($result.skipped).Count
            if ($testExitCode -eq 0 -and $result.tests -eq 2 -and $failures -eq 0 -and $errors -eq 0 -and $skipped -eq 0) { $status = 'PASS' } else { $status = 'FAIL' }
          }
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Main Bridge and raw PARTIAL page contracts: $status" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($status -ne 'PASS') { exit 1 }

      - name: Run scoped bid intent contract
        id: bid-intent-contract
        if: steps.install-python-deps.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $outputPath = 'build/ci-issue46-bid-intent.json'
          python tools/run_tests.py test_bid_intent_contract --output $outputPath
          $testExitCode = $LASTEXITCODE
          if (-not (Test-Path $outputPath)) {
            $status = 'NOT_RUN'
            'Issue #46 bid intent: NOT_RUN (no result file)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            $result = Get-Content $outputPath -Raw | ConvertFrom-Json
            if ($testExitCode -ne 0 -or $result.tests -ne 17 -or $result.failures.Count -gt 0 -or $result.errors.Count -gt 0 -or $result.skipped.Count -gt 0) {
              $status = 'FAIL'
            } else { $status = 'PASS' }
            "Issue #46 bid intent: $status; tests=$($result.tests); failures=$($result.failures.Count); errors=$($result.errors.Count); skipped=$($result.skipped.Count)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($status -ne 'PASS') { exit 1 }

      - name: Run durable bid obligation contracts
        id: durable-bid-obligations
        if: steps.install-python-deps.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $outputPath = 'build/ci-issue46-durable-bid-obligations.json'
          python tools/run_tests.py test_durable_bid_obligations --output $outputPath
          $testExitCode = $LASTEXITCODE
          if (-not (Test-Path $outputPath)) {
            $status = 'NOT_RUN'
            'Durable bid obligations: NOT_RUN (no result file)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            $result = Get-Content $outputPath -Raw | ConvertFrom-Json
            if ($testExitCode -ne 0 -or $result.tests -ne 15 -or $result.failures.Count -gt 0 -or $result.errors.Count -gt 0 -or $result.skipped.Count -gt 0) {
              $status = 'FAIL'
            } else { $status = 'PASS' }
            "Durable bid obligations: $status; tests=$($result.tests); failures=$($result.failures.Count); errors=$($result.errors.Count); skipped=$($result.skipped.Count)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($status -ne 'PASS') { exit 1 }

      - name: Run Main domain action receipt routing contract
        id: main-domain-action-receipts
        if: steps.install-python-deps.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $outputPath = 'build/ci-issue46-main-domain-action-receipts.json'
          python tools/run_tests.py test_main_domain_action_receipts --output $outputPath
          $testExitCode = $LASTEXITCODE
          if (-not (Test-Path $outputPath)) {
            $status = 'NOT_RUN'
            'Main domain action receipt routing: NOT_RUN (no result file)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            $result = Get-Content $outputPath -Raw | ConvertFrom-Json
            if ($testExitCode -ne 0 -or $result.tests -ne 2 -or $result.failures.Count -gt 0 -or $result.errors.Count -gt 0 -or $result.skipped.Count -gt 0) { $status = 'FAIL' }
            else { $status = 'PASS' }
            "Main domain action receipt routing: $status; tests=$($result.tests); failures=$($result.failures.Count); errors=$($result.errors.Count); skipped=$($result.skipped.Count)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($status -ne 'PASS') { exit 1 }

      - name: Run sparse warehouse content-step budget contract
        id: content-step-budget
        if: steps.install-python-deps.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $outputPath = 'build/ci-issue46-content-step-budget.json'
          python tools/run_tests.py test_native_content_step_budget --output $outputPath
          $testExitCode = $LASTEXITCODE
          if (-not (Test-Path $outputPath)) {
            $status = 'NOT_RUN'
            'Issue #46 sparse content-step budget: NOT_RUN (no result file)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            $result = Get-Content $outputPath -Raw | ConvertFrom-Json
            $expectedSkip = 'test_native_content_step_budget.ContentStepBudgetTests.test_real_originals_and_sent_vs_not_sent_then_safe_next_sampling'
            $unexpectedSkips = @($result.skipped | Where-Object { $_[0] -ne $expectedSkip })
            if ($testExitCode -ne 0 -or $result.tests -ne 4 -or $result.failures.Count -gt 0 -or $result.errors.Count -gt 0 -or $unexpectedSkips.Count -gt 0 -or $result.skipped.Count -ne 1) {
              $status = 'FAIL'
            } else { $status = 'PASS (private Issue #42 SOURCE SKIP)' }
            "Issue #46 sparse content-step budget: $status; tests=$($result.tests); skipped=$($result.skipped.Count)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($status -eq 'FAIL' -or $status -eq 'NOT_RUN') { exit 1 }

      - name: Run raw PARTIAL archive recovery contracts
        id: raw-partial-archive
        if: steps.install-python-deps.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $outputPath = 'build/ci-issue46-raw-partial.json'
          python tools/run_tests.py `
            test_native_warehouse_intake.NativeWarehouseIntakeTests.test_rejected_support_selection_keeps_raw_partial_cold_reopenable `
            test_native_warehouse_intake.NativeWarehouseIntakeTests.test_empty_support_selection_archives_raw_partial `
            --output $outputPath
          $testExitCode = $LASTEXITCODE
          if (-not (Test-Path $outputPath)) {
            $status = 'NOT_RUN'
          } else {
            $result = Get-Content $outputPath -Raw | ConvertFrom-Json
            if ($testExitCode -ne 0 -or $result.tests -ne 2 -or $result.failures.Count -gt 0 -or $result.errors.Count -gt 0 -or $result.skipped.Count -gt 0) { $status = 'FAIL' }
            else { $status = 'PASS' }
          }
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Issue #46 raw PARTIAL archive recovery: $status" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($status -ne 'PASS') { exit 1 }

      - name: Report Python contract status
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup-python.outcome }}
          DEPS_OUTCOME: ${{ steps.install-python-deps.outcome }}
          TEST_OUTCOME: ${{ steps.python-contract.outcome }}
          COMPAT_OUTCOME: ${{ steps.solver-source-compatibility.outcome }}
          COMPAT_STATUS: ${{ steps.solver-source-compatibility.outputs.status }}
          CONSUMER_OUTCOME: ${{ steps.native-consumer-contract.outcome }}
          CONSUMER_STATUS: ${{ steps.native-consumer-contract.outputs.status }}
          NATIVE_ARCHIVE_OUTCOME: ${{ steps.native-raw-archive-main.outcome }}
          NATIVE_ARCHIVE_STATUS: ${{ steps.native-raw-archive-main.outputs.status }}
          UI_OUTCOME: ${{ steps.bid-intent-ui.outcome }}
          UI_STATUS: ${{ steps.bid-intent-ui.outputs.status }}
          BID_OUTCOME: ${{ steps.bid-intent-contract.outcome }}
          BID_STATUS: ${{ steps.bid-intent-contract.outputs.status }}
          DURABLE_OUTCOME: ${{ steps.durable-bid-obligations.outcome }}
          DURABLE_STATUS: ${{ steps.durable-bid-obligations.outputs.status }}
          RECEIPT_OUTCOME: ${{ steps.main-domain-action-receipts.outcome }}
          RECEIPT_STATUS: ${{ steps.main-domain-action-receipts.outputs.status }}
          STEP_BUDGET_OUTCOME: ${{ steps.content-step-budget.outcome }}
          STEP_BUDGET_STATUS: ${{ steps.content-step-budget.outputs.status }}
          RAW_PARTIAL_OUTCOME: ${{ steps.raw-partial-archive.outcome }}
          RAW_PARTIAL_STATUS: ${{ steps.raw-partial-archive.outputs.status }}
          M1_OUTCOME: ${{ steps.m1-contracts.outcome }}
          M1_STATUS: ${{ steps.m1-contracts.outputs.status }}
          OBSERVE_OUTCOME: ${{ steps.observe-diagnostics.outcome }}
          OBSERVE_STATUS: ${{ steps.observe-diagnostics.outputs.status }}
          DELIVERY_OUTCOME: ${{ steps.native-delivery-contract.outcome }}
          DELIVERY_STATUS: ${{ steps.native-delivery-contract.outputs.status }}
          DELIVERY_TESTS: ${{ steps.native-delivery-contract.outputs.tests }}
          DELIVERY_FAILURES: ${{ steps.native-delivery-contract.outputs.failures }}
          DELIVERY_ERRORS: ${{ steps.native-delivery-contract.outputs.errors }}
          DELIVERY_SKIPPED: ${{ steps.native-delivery-contract.outputs.skipped }}
        shell: pwsh
        run: |
          if ($env:TEST_OUTCOME -eq 'success') {
            $status = 'PASS'
          } elseif ($env:SETUP_OUTCOME -ne 'success') {
            $status = "NOT_RUN (Python setup outcome: $env:SETUP_OUTCOME; see setup step log)"
          } elseif ($env:DEPS_OUTCOME -ne 'success') {
            $status = "NOT_RUN (dependency install outcome: $env:DEPS_OUTCOME; see install step log)"
          } else {
            $status = "FAIL (test outcome: $env:TEST_OUTCOME; see test step exit code and log)"
          }
          "Python offline contract: $status" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

          if ($env:COMPAT_OUTCOME -eq 'success' -and $env:COMPAT_STATUS -eq 'PASS') {
            $compatStatus = 'PASS'
          } elseif ($env:COMPAT_STATUS -eq 'SKIP') {
            $compatStatus = 'SKIP'
          } elseif ($env:COMPAT_OUTCOME -eq 'skipped' -or $env:SETUP_OUTCOME -ne 'success' -or $env:DEPS_OUTCOME -ne 'success') {
            $compatStatus = 'NOT_RUN'
          } else {
            $compatStatus = 'FAIL'
          }
          if ($env:CONSUMER_OUTCOME -eq 'success' -and $env:CONSUMER_STATUS -eq 'PASS') {
            $consumerStatus = 'PASS'
          } elseif ($env:CONSUMER_STATUS -eq 'SKIP') {
            $consumerStatus = 'SKIP'
          } elseif ($env:CONSUMER_STATUS -eq 'NOT_RUN') {
            $consumerStatus = 'NOT_RUN'
          } elseif ($env:CONSUMER_OUTCOME -eq 'skipped' -or $env:SETUP_OUTCOME -ne 'success' -or $env:DEPS_OUTCOME -ne 'success') {
            $consumerStatus = 'NOT_RUN'
          } else {
            $consumerStatus = 'FAIL'
          }
          "Strict venue compatibility and mapping: $compatStatus" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Native consumer regressions: $consumerStatus" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Raw PARTIAL Main archive reader bridge: $env:NATIVE_ARCHIVE_STATUS" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Read-only bid intent status UI: $env:UI_STATUS" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Scoped bid intent contract: $env:BID_STATUS" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($env:DURABLE_OUTCOME -eq 'success' -and $env:DURABLE_STATUS -eq 'PASS') {
            $durableStatus = 'PASS'
          } elseif ($env:DURABLE_OUTCOME -eq 'skipped' -or $env:SETUP_OUTCOME -ne 'success' -or $env:DEPS_OUTCOME -ne 'success') {
            $durableStatus = 'NOT_RUN'
          } else {
            $durableStatus = 'FAIL'
          }
          "Durable bid obligation contracts: $durableStatus" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($env:RECEIPT_OUTCOME -eq 'success' -and $env:RECEIPT_STATUS -eq 'PASS') {
            $receiptStatus = 'PASS'
          } elseif ($env:RECEIPT_OUTCOME -eq 'skipped' -or $env:SETUP_OUTCOME -ne 'success' -or $env:DEPS_OUTCOME -ne 'success') {
            $receiptStatus = 'NOT_RUN'
          } else {
            $receiptStatus = 'FAIL'
          }
          "Main domain action receipt routing: $receiptStatus" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Sparse content-step budget contract: $env:STEP_BUDGET_STATUS" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Raw PARTIAL archive recovery: $env:RAW_PARTIAL_STATUS" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($env:M1_OUTCOME -eq 'skipped' -or $env:SETUP_OUTCOME -ne 'success' -or $env:DEPS_OUTCOME -ne 'success') {
            $m1Status = 'NOT_RUN'
          } elseif ($env:M1_STATUS) {
            $m1Status = $env:M1_STATUS
          } else {
            $m1Status = 'FAIL'
          }
          "M1 partial DRAFT + one-shot contracts: $m1Status" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($env:OBSERVE_OUTCOME -eq 'skipped' -or $env:SETUP_OUTCOME -ne 'success' -or $env:DEPS_OUTCOME -ne 'success') {
            $observeStatus = 'NOT_RUN'
          } elseif ($env:OBSERVE_STATUS) {
            $observeStatus = $env:OBSERVE_STATUS
          } else {
            $observeStatus = 'FAIL'
          }
          "Observe-stage / scene-loading regressions: $observeStatus" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($env:DELIVERY_OUTCOME -eq 'skipped' -or $env:SETUP_OUTCOME -ne 'success' -or $env:DEPS_OUTCOME -ne 'success') {
            $deliveryStatus = 'NOT_RUN'
          } elseif ($env:DELIVERY_OUTCOME -eq 'success' -and $env:DELIVERY_STATUS -eq 'PASS' -and $env:DELIVERY_TESTS -eq '15' -and $env:DELIVERY_FAILURES -eq '0' -and $env:DELIVERY_ERRORS -eq '0' -and $env:DELIVERY_SKIPPED -eq '0') {
            $deliveryStatus = 'PASS'
          } else {
            $deliveryStatus = 'FAIL'
          }
          "Full Native DELIVERY contract: $deliveryStatus; tests=$env:DELIVERY_TESTS; failures=$env:DELIVERY_FAILURES; errors=$env:DELIVERY_ERRORS; skipped=$env:DELIVERY_SKIPPED" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($env:TEST_OUTCOME -ne 'success' -or $compatStatus -ne 'PASS' -or $consumerStatus -ne 'PASS' -or $env:NATIVE_ARCHIVE_STATUS -ne 'PASS' -or $env:UI_STATUS -ne 'PASS' -or $env:BID_STATUS -ne 'PASS' -or $durableStatus -ne 'PASS' -or $receiptStatus -ne 'PASS' -or $env:STEP_BUDGET_STATUS -notlike 'PASS*' -or $env:RAW_PARTIAL_STATUS -ne 'PASS' -or $m1Status -ne 'PASS' -or $observeStatus -ne 'PASS' -or $deliveryStatus -ne 'PASS') { exit 1 }

  dotnet-scroll-diagnostics:
    name: .NET 8 offline scroll diagnostics
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 8
        id: setup-dotnet
        continue-on-error: true
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build production WGC Native Host
        id: wgc-host-build
        if: steps.setup-dotnet.outcome == 'success'
        shell: pwsh
        run: dotnet build architecture/v2/host/wgc_live_harness/WgcLiveHarness.csproj --configuration Release --output build/ci-luna-b-wgc-host

      - name: Run isolated adapter pre-send diagnostics
        id: dotnet-contract
        if: steps.setup-dotnet.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $workDir = Join-Path $env:GITHUB_WORKSPACE 'build/ci-native-scroll-diagnostics'
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null
          dotnet run --project tests/native_scroll_diagnostics/scroll-diagnostics.csproj -- $workDir --adapter-presend-only
          $testExitCode = $LASTEXITCODE
          "test_exit_code=$testExitCode" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($testExitCode -ne 0) { exit $testExitCode }

      - name: Report .NET contract status
        id: dotnet-report
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup-dotnet.outcome }}
          TEST_OUTCOME: ${{ steps.dotnet-contract.outcome }}
        shell: pwsh
        run: |
          if ($env:TEST_OUTCOME -eq 'success') {
            $status = 'PASS'
          } elseif ($env:SETUP_OUTCOME -ne 'success') {
            $status = "NOT_RUN (.NET setup outcome: $env:SETUP_OUTCOME; see setup step log)"
          } else {
            $status = "FAIL (diagnostics outcome: $env:TEST_OUTCOME; see test step exit code and log)"
          }
          ".NET offline contract: $status" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($env:TEST_OUTCOME -ne 'success') { exit 1 }

      - name: Run second-scroll post-send contracts
        id: second-scroll-contract
        if: steps.setup-dotnet.outcome == 'success'
        shell: pwsh
        run: |
          $workDir = Join-Path $env:GITHUB_WORKSPACE 'build/ci-second-scroll'
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null
          $output = dotnet run --project tests/native_scroll_diagnostics/scroll-diagnostics.csproj -- $workDir --second-scroll-only 2>&1
          $testExitCode = $LASTEXITCODE
          $output | Write-Output
          $cases = @($output | ForEach-Object { if ($_ -match '^PASS: (second-scroll-\S+)\s*$') { $Matches[1] } } | Sort-Object -Unique)
          if ($testExitCode -ne 0) { $status = 'FAIL' }
          elseif ($cases.Count -ne 16) { $status = 'NOT_RUN' }
          else { $status = 'PASS' }
          "Second-scroll contracts: $status; distinct cases=$($cases.Count); exit=$testExitCode" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($status -ne 'PASS') { exit 1 }

      - name: Set up Python for domain action session contract
        id: setup-python-domain-actions
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run bounded Native domain action scenarios
        id: domain-action-harness
        shell: pwsh
        run: |
          $workDir = Join-Path $env:GITHUB_WORKSPACE 'build/native-domain-actions'
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null
          $workflowPath = Join-Path $workDir 'workflow.json'
          $output = dotnet run --project tests/native_domain_actions/domain-actions.csproj -- $workflowPath 2>&1
          $testExitCode = $LASTEXITCODE
          $output | Write-Output
          $summaryLine = @($output | Where-Object { $_ -match '^PASS 10 scenarios \(fake input only\)$' })
          if ($testExitCode -ne 0 -or $summaryLine.Count -ne 1 -or -not (Test-Path $workflowPath)) { $status = 'FAIL' }
          else { $status = 'PASS (10 fake-backend scenarios)' }
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Native domain action harness: $status" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($testExitCode -ne 0 -or $status -eq 'FAIL') { exit 1 }

      - name: Run receipt-driven domain action session contracts
        id: domain-action-session
        shell: pwsh
        run: |
          $outputPath = 'build/ci-issue46-domain-action-session.json'
          python tools/run_tests.py test_domain_action_session test_session_fsm --output $outputPath
          $testExitCode = $LASTEXITCODE
          if (-not (Test-Path $outputPath)) {
            $status = 'NOT_RUN'
            'Domain action session contracts: NOT_RUN (no result file)' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            $result = Get-Content $outputPath -Raw | ConvertFrom-Json
            if ($testExitCode -ne 0 -or $result.tests -ne 15 -or $result.failures.Count -gt 0 -or $result.errors.Count -gt 0 -or $result.skipped.Count -gt 0) { $status = 'FAIL' }
            else { $status = 'PASS' }
            "Domain action session contracts: $status; tests=$($result.tests); failures=$($result.failures.Count); errors=$($result.errors.Count); skipped=$($result.skipped.Count)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($status -ne 'PASS') { exit 1 }

      - name: Run isolated Windows ticketed input dummy
        id: domain-action-dummy
        shell: pwsh
        run: |
          $output = dotnet run --project tests/native_domain_actions/domain-actions.csproj -- --dummy-window 2>&1
          $testExitCode = $LASTEXITCODE
          $output | Write-Output
          $summaryLine = @($output | Where-Object { $_ -match '^PASS Windows dummy adapter; HTGame never constructed/discovered/authorized$' })
          if ($testExitCode -ne 0 -or $summaryLine.Count -ne 1) { $status = 'FAIL' }
          else { $status = 'PASS (isolated dummy window only)' }
          "Windows ticketed input dummy: $status" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($status -notlike 'PASS*') { exit 1 }
